services:
  - type: web
    name: ledgerly-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./data/ledgerly.db
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
    disk:
      name: ledgerly-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
